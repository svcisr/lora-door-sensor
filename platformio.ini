; LoRa door sensor for DX-SMART DX-LR30-433M22SP(T1) boards
; (STM32F103C8T6 + SX1262 433 MHz). Each sensor/receiver pair has its own network ID.
;
;   pio run                                   build all firmwares
;   pio run -e sensor   -t upload --upload-port COMx          pair 1 (network 0xA001)
;   pio run -e receiver -t upload --upload-port COMy
;   pio run -e sensor_pair2 -t upload --upload-port COMx      pair 2 (network 0xA002)
;   pio device monitor -e receiver --port COMy

[platformio]
default_envs = sensor, receiver, sensor_pair2, receiver_pair2

[env]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
lib_deps =
    jgromes/RadioLib@^7.1.2
build_flags =
    -Wall
    -I include
    -I src/common
    ; Serial = USART1 on PA9/PA10 (CH340C / USB-C). The generic variant would
    ; use USART2 on PA2/PA3, which are the radio's BUSY and NRESET lines.
    -D SERIAL_UART_INSTANCE=1
    -D PIN_SERIAL_RX=PA10
    -D PIN_SERIAL_TX=PA9
    ; only the SX126x driver is needed: skip the rest of RadioLib
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_BELL
    -D RADIOLIB_EXCLUDE_FSK4
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_LORAWAN
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_PAGER
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV

; Upload over the USB-C port with tools/stm32_uart_flash.py. The DX-PJ26 board
; has no automatic BOOT0/reset circuit, so the running door firmware restarts
; itself into the ROM bootloader on a serial command (src/common/bootloader.cpp).
; A board still running other firmware needs the bootloader started first
; (see README).
upload_protocol = custom
upload_speed = 115200
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/stm32_uart_flash.py" flash $UPLOAD_PORT --enter --wait 30 --baud $UPLOAD_SPEED --write "$SOURCE"

; BOOT0 follows the CH340's DTR line (deasserted = BOOT0 high = ROM bootloader on
; reset), so the monitor asserts DTR: a reset while monitoring starts the app.
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

[env:sensor]
build_src_filter = +<common/> +<sensor/>

[env:receiver]
build_src_filter = +<common/> +<receiver/>

; Pair 2: same firmware, own network ID
[env:sensor_pair2]
extends = env:sensor
build_flags = ${env.build_flags} -D NETWORK_ID=0xA002

[env:receiver_pair2]
extends = env:receiver
build_flags = ${env.build_flags} -D NETWORK_ID=0xA002

; Board power test: LED blink + STOP sleep only, no UART, no radio (unplug the LR30-A).
; It has no bootloader command: press RST when the upload asks.
[env:power_test]
build_src_filter = +<power_test/> +<sensor/sleep_timer.cpp>
build_flags = ${env.build_flags} -I src/sensor

; Radio pin test: adds the sensor's sleep state of one radio pin per 10 s step (LED blinks
; the step number) to find a pin that draws current into the LR30-A while asleep.
[env:pin_test]
extends = env:power_test
build_src_filter = +<pin_test/> +<sensor/sleep_timer.cpp>

; Sleep test: radio asleep as in the sensor, then one pin per 10 s step released to analog
; (LED blinks the step number) to find what still draws current while asleep.
[env:sleep_test]
extends = env:power_test
build_src_filter = +<sleep_test/> +<sensor/sleep_timer.cpp> +<common/door_radio.cpp> +<common/door_protocol.cpp>

; Same firmwares, uploaded with an ST-LINK on the SWD header (C D G V) instead of USB:
;   pio run -e sensor_swd -t upload
; Connects under reset (ST-LINK NRST wired to the RST button): the sleeping sensor is
; unreachable over SWD otherwise.
[swd]
upload_protocol = stlink
upload_command =
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
debug_tool = stlink

[env:sensor_swd]
extends = env:sensor, swd

[env:receiver_swd]
extends = env:receiver, swd

[env:sensor_pair2_swd]
extends = env:sensor_pair2, swd

[env:receiver_pair2_swd]
extends = env:receiver_pair2, swd
